workflows:
  ios-release:
    name: My Digital Shoes — iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalshoes.app
      vars:
        XCODE_PROJECT: "artifacts/outfit-generator/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.mydigitalshoes.app"
        APPLE_TEAM_ID: "QXGDJ93HP8"
      node: 22.13.0

    scripts:
      - name: Install pnpm
        script: |
          corepack disable
          npm install -g pnpm@11.13.1 --force

      - name: Install dependencies
        script: pnpm install --no-frozen-lockfile --force

      - name: Build web app
        script: pnpm --filter @workspace/outfit-generator run build

      - name: Sync Capacitor iOS
        script: |
          cd artifacts/outfit-generator
          npx cap sync ios

      - name: Set build number
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID") + 1))
          cd artifacts/outfit-generator/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build and sign iOS
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
